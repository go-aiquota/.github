name: Renovate

on:
  schedule:
    # 00:00 UTC. The 00/11/22/33/44 walk the fleet used is full: 115 of its 120 slots are taken, so this sits on a five-minute grid instead. 00 UTC is the quietest hour, holding three runners against five nearly everywhere else.
    - cron: '0 0 * * *'
  workflow_dispatch:
    inputs:
      logLevel:
        description: Renovate log level
        default: info

concurrency:
  group: renovate
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  renovate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Run Renovate
        uses: renovatebot/github-action@v46.3.0
        with:
          configurationFile: config.js
          token: ${{ secrets.RENOVATE_TOKEN }}
        env:
          LOG_LEVEL: ${{ inputs.logLevel || 'info' }}
